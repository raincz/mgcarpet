name: Release

# Binary releases for playtesters: push a `v*` tag (or run manually
# for a dry run — the manual run only uploads workflow artifacts, no
# Release is created). The game is engine-only; testers bring their
# own GOG data and the binary bakes it on first run (see README).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported LTS runner = oldest glibc the binary
          # demands; newer distros run it fine.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # PINNED like ci.yml — and here it is not optional bookkeeping:
      # `rust-toolchain.toml` is a rustup DIRECTORY override, so it wins
      # over whatever this step makes default the moment cargo runs
      # inside the repo. Leaving `@stable` here would have shipped a
      # binary built by 1.96.1 under a workflow line claiming stable,
      # and made the runner download a second toolchain to do it.
      # Releases are therefore built by the same compiler the
      # conformance corpus was certified against.
      # ⚠ Must equal rust-toolchain.toml's `channel` and ci.yml's.
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies (ALSA headers for cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p mgc-app -p mgc-import
      - name: Package
        shell: bash
        run: |
          name="mgcarpet-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release"
          # mgcarpet = the game; magic-carpet-* = the double-clickable
          # campaign launchers (each just starts mgcarpet --campaign
          # from its own folder — no command line needed).
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$bin/mgcarpet.exe" "$bin/mgc-import.exe" \
               "$bin/magic-carpet-1.exe" "$bin/magic-carpet-hidden-worlds.exe" \
               "$bin/magic-carpet-2.exe" "dist/$name/"
          else
            cp "$bin/mgcarpet" "$bin/mgc-import" \
               "$bin/magic-carpet-1" "$bin/magic-carpet-hidden-worlds" \
               "$bin/magic-carpet-2" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          # The GM music soundfont + its license, committed under
          # assets/static/ and shipped beside the binary so the first-run
          # bake renders the General MIDI arrangement out of the box (no
          # system fluidsynth — the synth is pure Rust, see
          # crates/mgc-import/src/synth.rs). Non-fatal: without the font
          # the bake falls back to the AdLib FM arrangement, as before.
          if cp assets/static/GeneralUser-GS.sf2 "dist/$name/"; then
            cp assets/static/GeneralUser-GS-LICENSE.txt "dist/$name/" || true
            echo "bundled soundfont from assets/static/"
          else
            echo "::warning::assets/static/GeneralUser-GS.sf2 missing — release will be FM-only"
          fi
          # The ready-to-fill gamedata/ folder: its README describes
          # the expected GOG-install layout (referenced by the main
          # README's quickstart) — testers drop their retail packs in
          # next to the binary and run.
          mkdir -p "dist/$name/gamedata"
          cp gamedata/README.md "dist/$name/gamedata/"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mgcarpet-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
