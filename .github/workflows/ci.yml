name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # PINNED, not `@stable` — see rust-toolchain.toml for why (clippy's
      # lint set is not version-stable, unlike rustfmt's style edition).
      # ⚠ Must equal rust-toolchain.toml's `channel`, and both should
      # track the MAINTAINER's distro rustc: that file is a rustup
      # directory override and the maintainer's cargo is not rustup's,
      # so local is the thing being matched, not the thing being pinned.
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies (ALSA headers for cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        shell: bash
        run: cargo test --workspace 2>&1 | tee test.log
      - name: Golden skip report
        shell: bash
        # Goldens self-skip without baked/ (never available in CI) but
        # each skip prints a grep-able GOLDEN-SKIP line — this step
        # makes the count visible instead of the suite reading as
        # "everything verified". A fixture-equipped runner (or the
        # local pre-release check) runs the suite with
        # MGC_REQUIRE_GOLDENS=1, which turns every skip into a FAILURE.
        run: echo "golden tests skipped (no baked fixtures) — $(grep -c 'GOLDEN-SKIP' test.log || true)"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
    # Game data is never available in CI; the gamedata integration test
    # self-skips (see the Golden skip report step above). Real-data
    # verification happens locally: the required pre-release step is
    #   MGC_REQUIRE_GOLDENS=1 cargo test --workspace
    # against a real baked/ tree, which FAILS on any golden skip.
