[package]
name = "mgc-import"
description = "Importer/baker: expands original GOG game data into engine packages"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
flacenc = "0.5.1"
# GOG's offline installers are Inno Setup packages: read and unpacked in
# process (src/sources.rs), so importing one needs no external tool on
# any platform. `innospect` keeps the per-file script hooks that name
# GOG's hashed file parts; the parts themselves are zlib (flate2) with
# an MD5 per part and per file (md-5).
innospect = "0.2.0"
flate2 = "1"
md-5 = "0.11"
mgc-awe32 = { path = "../mgc-awe32" }
mgc-formats = { path = "../mgc-formats" }
mgc-sim = { path = "../mgc-sim" }
midly = { version = "0.5.3", default-features = false, features = ["std"] }
nuked-opl3 = "0.1.0"
oxisynth = { version = "0.1.0", features = ["i16-out"] }
serde_json = "1"
sha2 = "0.10"
# The bundled AWE32 wave ROM ships zstd-compressed (assets/static/).
zstd = "0.13"

[[bin]]
name = "mgc-import"
path = "src/main.rs"

[lints]
workspace = true
